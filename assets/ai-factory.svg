<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">AI Use Case Factory</title><desc id="desc">English project overview: five stages from framing to roadmap and a value-feasibility matrix. Sixteen fictional use cases across three organizations.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#d2ef89" stroke-opacity=".04" fill="none"/></pattern></defs><rect width="1440" height="760" fill="#101713"/><rect width="1440" height="760" fill="url(#grid)"/><text x="74" y="65" font-family="monospace" font-size="14" letter-spacing="2" fill="#d2ef89">AI INVESTMENTS / VALUE / RISK</text><text x="70" y="146" font-family="Arial,sans-serif" font-size="68" letter-spacing="-2" fill="#f0f0e6">AI Use Case Factory</text><text x="74" y="200" font-family="Arial,sans-serif" font-size="26" fill="#b2c1b1">Turn a use case into an investment decision.</text><path d="M74 260H1366" stroke="#354a39"/><g font-family="monospace" font-size="16" text-anchor="middle" fill="#d2ef89"><path d="M210 340H1230" fill="none" stroke="#506349" stroke-width="2"/><g stroke="#60754f" fill="#1a251c"><rect x="74" y="300" width="235" height="80"/><rect x="338" y="300" width="235" height="80"/><rect x="602" y="300" width="235" height="80"/><rect x="866" y="300" width="235" height="80"/><rect x="1130" y="300" width="235" height="80"/></g><text x="191" y="348">01 / Framing</text><text x="455" y="348">02 / Scoring</text><text x="719" y="348">03 / Risk</text><text x="983" y="348">04 / Business case</text><text x="1247" y="348">05 / Roadmap</text></g><text x="76" y="490" font-family="Arial,sans-serif" font-size="64" fill="#f0f0e6">16 use cases.</text><text x="76" y="563" font-family="Arial,sans-serif" font-size="64" fill="#f0f0e6">3 organizations.</text><text x="80" y="609" font-family="Arial,sans-serif" font-size="19" fill="#b2c1b1">Fictional scenarios. Explicit assumptions.</text><g fill="none" stroke="#506349"><rect x="814" y="433" width="550" height="196"/><path d="M1089 433V629M814 531H1364"/></g><g font-family="monospace" font-size="13" fill="#b2c1b1"><text x="837" y="463">STRATEGIC PROJECT</text><text x="1159" y="463" fill="#d2ef89">QUICK WIN</text><text x="837" y="605">LOW PRIORITY</text><text x="1159" y="605">EXPLORE</text><text x="1089" y="665" text-anchor="middle">FEASIBILITY →</text><text x="795" y="540" text-anchor="end">VALUE ↑</text><text x="74" y="713">NPV · MONTE CARLO · RISK ASSESSMENT · ROADMAP</text></g></svg>
